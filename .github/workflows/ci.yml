name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  # The release workflow runs the whole suite on the tag before it builds.
  workflow_call:

# A second push to the same branch supersedes the first: no point burning
# minutes on a commit nobody will look at again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: JetPack 6 ships it, and edge devices are a
        # supported target. It broke twice while being lowered — once on
        # `datetime.UTC`, once on `fromisoformat` refusing the "Z" suffix —
        # so it is tested, not assumed.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      # The classifiers extra is deliberately absent: an autouse fixture forces
      # it off so no test loads real weights, and installing torch here would
      # add gigabytes to every run to exercise code the tests already stub.
      - name: Tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `uv run ruff` without the extra creates a bare environment and then
      # fails to spawn a tool it never installed.
      - name: Ruff
        run: uv run --extra dev ruff check src tests

      # Dependencies are pinned on purpose: a lockfile that drifts from
      # pyproject.toml means two installs of the same commit can differ, which
      # is the one thing a tool about reproducibility cannot allow.
      - name: Lockfile is current
        run: uv lock --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # Catches a broken package before PyPI does, not after.
      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

  # The suite runs from the source tree, where every template, stylesheet,
  # scenario pack and dataset exists whether or not the wheel ships it. This
  # installs the wheel with the `ui` extra into an empty environment, as a user
  # would, and drives the dashboard's flow from there against test doubles.
  ui-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build the wheel
        run: uv build --wheel

      - name: Install opaas[ui] from it into a clean environment
        run: |
          uv venv /tmp/clean --python 3.12
          uv pip install --python /tmp/clean "opaas[ui] @ file://$PWD/$(ls dist/*.whl)"

      # -I keeps the checkout off sys.path: the package must come from the wheel.
      - name: Dashboard flow from the install
        run: /tmp/clean/bin/python -I scripts/smoke_ui_install.py --installed
