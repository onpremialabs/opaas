[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opaas"
version = "0.4.0"
description = "OPAAS — On-Prem AI Audit Suite: evaluation and digital credential for on-prem LLM models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "onpremIA Labs" }]
keywords = ["llm", "benchmark", "on-prem", "evaluation", "verifiable-credentials"]

dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
    "cryptography>=42.0",
    # System and server-process RAM. For GPU, nvidia-smi is enough, but for
    # memory there is no universal CLI and doing it per-OS by hand is more fragile.
    "psutil>=5.9",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    # Only to read the mascot PNG: they regenerate the sprite and check that the
    # committed one is still that image. The tool itself does not use them.
    "pillow>=10.0",
    "numpy>=1.24",
    # The `ui` extra, so the dashboard's tests run in CI without a second sync.
    "starlette>=0.40",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]
# The local dashboard, `opaas ui` (D75, D79): a small ASGI server and its
# templates. Optional so the base install stays as small as it is; imported only
# inside `opaas ui`.
ui = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]
# Pinned block D classifiers (faithfulness and toxicity). Optional on purpose:
# torch weighs more than everything else combined, and without it OPAAS
# works just the same, declaring that it did not measure those dimensions.
classifiers = [
    "torch>=2.2",
    "transformers>=4.40",
    # Fetches the pinned default classifiers into the cache on first use, the
    # same way datasets download themselves. transformers already pulls this
    # in transitively; pinned here because classifiers/cache.py calls its API
    # directly.
    "huggingface-hub>=0.24",
]
# The offline root signs delegations from a hardware token through PKCS#11
# (D65): a YubiKey's PIV applet via ykcs11, or OpenSC. Only the machine that
# holds the token needs it; verifying never does.
token = [
    "python-pkcs11>=0.7",
]

[project.scripts]
opaas = "opaas.cli.main:app"

[project.urls]
Homepage = "https://onpremialabs.com"
# The repository lives at onpremialabs/opaas. Its earlier names
# (luxinopanyvino/opaas-bench, and opas-bench before that) only work while
# GitHub keeps a redirect, which ends the day anyone reuses the old name.
Repository = "https://github.com/onpremialabs/opaas"

[tool.hatch.build.targets.wheel]
packages = ["src/opaas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
