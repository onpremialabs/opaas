[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opaas"
version = "0.4.0"
description = "On-Prem AI Audit Suite: audit the models, agents and AI systems you run yourself, and certify what was measured"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "onpremIA Labs" }]
keywords = [
    "llm", "llm-evaluation", "ai-audit", "ai-agents", "agent-auditability", "on-premise",
    "air-gapped", "benchmark", "mcp", "ollama", "vllm", "ai-act", "certification",
    "verifiable-credentials",
]
# No license classifier: `license` above is an SPDX expression (PEP 639), which
# forbids repeating it as a classifier. Beta while the methodology is 1.0-draft.
# Only the systems a run has been tried on: Linux in CI, Windows by hand; macOS
# joins the list once something has run it.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
    "cryptography>=42.0",
    # System and server-process RAM. For GPU, nvidia-smi is enough, but for
    # memory there is no universal CLI and doing it per-OS by hand is more fragile.
    "psutil>=5.9",
    "segno>=1.6",
    # An environment's own configuration is YAML as often as JSON (compose files,
    # app configs): read with safe_load only, never executed (D87).
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    # Only to read the mascot PNG: they regenerate the sprite and check that the
    # committed one is still that image. The tool itself does not use them.
    "pillow>=10.0",
    "numpy>=1.24",
    # The `ui` extra, so the dashboard's tests run in CI without a second sync.
    "starlette>=0.40",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]
# The local dashboard, `opaas ui` (D75, D79): a small ASGI server and its
# templates. Optional so the base install stays as small as it is; imported only
# inside `opaas ui`.
ui = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]
# Pinned block D classifiers (faithfulness and toxicity). Optional on purpose:
# torch weighs more than everything else combined, and without it OPAAS
# works just the same, declaring that it did not measure those dimensions.
classifiers = [
    "torch>=2.2",
    "transformers>=4.40",
    # Fetches the pinned default classifiers into the cache on first use, the
    # same way datasets download themselves. transformers already pulls this
    # in transitively; pinned here because classifiers/cache.py calls its API
    # directly.
    "huggingface-hub>=0.24",
]
# The offline root signs delegations from a hardware token through PKCS#11
# (D65): a YubiKey's PIV applet via ykcs11, or OpenSC. Only the machine that
# holds the token needs it; verifying never does.
token = [
    "python-pkcs11>=0.7",
]
# Every measuring capability at once: the dashboard and the block D classifiers.
# Not `token`, which only the machine that holds the root's hardware token needs.
all = [
    "opaas[ui,classifiers]",
]

[project.scripts]
opaas = "opaas.cli.main:app"

[project.urls]
Homepage = "https://onpremialabs.com"
# The repository lives at onpremialabs/opaas. Its earlier names
# (luxinopanyvino/opaas-bench, and opas-bench before that) only work while
# GitHub keeps a redirect, which ends the day anyone reuses the old name.
Repository = "https://github.com/onpremialabs/opaas"
Documentation = "https://github.com/onpremialabs/opaas/blob/develop/docs/guide.md"
Methodology = "https://github.com/onpremialabs/opaas/blob/develop/docs/methodology.md"
Changelog = "https://github.com/onpremialabs/opaas/blob/develop/CHANGELOG.md"
Issues = "https://github.com/onpremialabs/opaas/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/opaas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
